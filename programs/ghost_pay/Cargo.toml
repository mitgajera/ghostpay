[package]
name = "ghost_pay"
version = "0.1.0"
description = "GhostPay — privacy-preserving payroll receipt on Solana"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "ghost_pay"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build"]
default = []

[dependencies]
anchor-lang = "0.32.1"
